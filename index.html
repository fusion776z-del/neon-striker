<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>NEON STRIKER ARRANGE - THUNDER FORCE STYLE FM BGM</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>

:root{--bg1:#020611;--bg2:#071226;--cyan:#72f7ff;--pink:#ff5db1;--orange:#ffb347;--green:#89ff9b;--red:#ff6262}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;color:#fff;background:
radial-gradient(circle at 15% 15%, rgba(0,180,255,.14), transparent 28%),
radial-gradient(circle at 82% 24%, rgba(255,90,177,.12), transparent 26%),
radial-gradient(circle at 60% 80%, rgba(137,255,155,.09), transparent 28%),
linear-gradient(180deg,#010309,#070d1a 50%, #02040b 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.frame{padding:16px;border-radius:24px;background:rgba(9,16,32,.72);backdrop-filter:blur(10px);border:1px solid rgba(114,247,255,.22);box-shadow:0 22px 70px rgba(0,0,0,.48),0 0 40px rgba(114,247,255,.08)}
canvas{display:block;border-radius:16px;background:#020611;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 0 28px rgba(114,247,255,.08);outline:none}
.caption{margin-top:10px;display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.08em;color:rgba(222,242,255,.8)}
.pill{padding:5px 10px;border-radius:999px;border:1px solid rgba(114,247,255,.22);background:rgba(10,19,40,.54)}

/* === iPhone playability tweaks v2: smaller canvas + compact joystick/buttons === */
html,body{height:100%;}
body{touch-action:none; overscroll-behavior:none;}
.frame{position:relative; display:grid; place-items:center; padding:14px;}
/* Smaller canvas so whole game is visible + room for controls */
#game{width:min(78vw, calc(78vh * 16 / 9)); height:auto; aspect-ratio:16/9; max-width:900px; touch-action:none;}

/* Diagnostics overlay */
.diag{position:absolute; right:10px; top:10px; max-width:70ch; padding:9px 10px; border-radius:14px;
 background:rgba(0,0,0,.60); border:1px solid rgba(255,98,98,.40);
 color:rgba(255,255,255,.92); font:12px ui-monospace, SFMono-Regular, Menlo, monospace;
 display:none; white-space:pre-wrap; z-index:40;}

/* Landscape helper */
.rotate-hint{position:absolute; inset:0; display:none; place-items:center; text-align:center; padding:20px;
 background:rgba(0,0,0,.72); backdrop-filter:blur(6px); z-index:35;}
.rotate-hint .card{max-width:520px; border-radius:20px; padding:16px 16px 14px;
 border:1px solid rgba(255,216,77,.25); background:rgba(10,19,40,.55);
 box-shadow:0 18px 60px rgba(0,0,0,.45);} 
.rotate-hint .ttl{font-size:17px; font-weight:800; letter-spacing:.08em; color:#ffd84d; margin-bottom:8px;}
.rotate-hint .msg{font-size:13px; line-height:1.6; color:rgba(255,255,255,.86);} 
.rotate-hint .mini{margin-top:10px; font-size:12px; color:rgba(222,242,255,.72);} 
/* === Virtual Joystick (smaller + higher) === */
#joystick{position:fixed; left:12px; bottom:110px; width:104px; height:104px; border-radius:999px;
 background:rgba(114,247,255,.10); border:1px solid rgba(114,247,255,.28); backdrop-filter:blur(6px);
 box-shadow:0 10px 26px rgba(0,0,0,.35); z-index:60; touch-action:none;}
#joystick .base{position:absolute; inset:0; border-radius:999px;
 background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.12), transparent 55%);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);} 
#joystick .stick{position:absolute; left:50%; top:50%; width:48px; height:48px; border-radius:999px;
 transform:translate(-50%,-50%); background:rgba(114,247,255,.88);
 box-shadow:0 8px 18px rgba(0,0,0,.33), 0 0 18px rgba(114,247,255,.22);} 
#joystick .label{position:absolute; left:50%; top:-10px; transform:translateX(-50%);
 font-size:9px; letter-spacing:.12em; color:rgba(222,242,255,.70);} 

/* === Action buttons (smaller, arranged so bomb reachable) === */
.actions{position:fixed; right:12px; bottom:88px; display:flex; flex-direction:column; gap:10px; align-items:flex-end; z-index:60;}
.actions .row{display:flex; gap:10px; justify-content:flex-end;}
.tbtn{width:56px; height:56px; border-radius:18px;
 border:1px solid rgba(114,247,255,.22); background:rgba(10,19,40,.38);
 backdrop-filter:blur(6px); box-shadow:0 8px 22px rgba(0,0,0,.35);
 display:grid; place-items:center; color:rgba(255,255,255,.92);
 font-weight:800; letter-spacing:.08em; user-select:none; -webkit-user-select:none; touch-action:none;}
.tbtn:active, .tbtn.active{transform:scale(0.96); background:rgba(114,247,255,.18);} 
.tbtn.small{width:48px; height:48px; border-radius:16px; font-size:12px;}
.tbtn.big{width:64px; height:64px; border-radius:20px; font-size:12px;}
.tbtn.wide{width:132px; height:54px; border-radius:18px; font-size:12px;}
.tbtn.warn{border-color:rgba(255,93,177,.28);} .tbtn.gold{border-color:rgba(255,216,77,.28);} .tbtn.green{border-color:rgba(137,255,155,.28);} 

/* keep away from home indicator */
@supports (padding: max(0px)){
  #joystick{bottom:calc(110px + env(safe-area-inset-bottom));}
  .actions{bottom:calc(88px + env(safe-area-inset-bottom));}
}

@media (pointer:fine){#joystick,.actions{display:none;}}

/* === Mobile Control UI (Tuned) === */
#mobileUI{
  position:fixed; right:12px; bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:10px; z-index:80;
}
.btn{
  width:76px; height:64px; border-radius:18px; display:grid; place-items:center;
  background:rgba(10,19,40,.55); border:1px solid rgba(114,247,255,.25);
  backdrop-filter:blur(6px); box-shadow:0 10px 28px rgba(0,0,0,.45);
  color:#fff; font-weight:800; letter-spacing:.08em; touch-action:none; user-select:none;
}
.btn.small{width:58px; height:52px; font-size:12px;}
.btn:active,.btn.active{background:rgba(114,247,255,.22); transform:scale(0.96);}
@media(pointer:fine){#mobileUI{display:none;}}

/* === OVERRIDE: iPhone edge controls (bottom-left joystick / top-left focus) === */
#joystick{left:calc(0px + env(safe-area-inset-left)); bottom:calc(0px + env(safe-area-inset-bottom));}
#focusBtn{position:fixed; left:calc(0px + env(safe-area-inset-left)); top:calc(0px + env(safe-area-inset-top));
 width:96px; height:46px; border-radius:16px; z-index:80;
 border:1px solid rgba(137,255,155,.30); background:rgba(10,19,40,.38);
 backdrop-filter:blur(6px); box-shadow:0 8px 22px rgba(0,0,0,.35);
 display:grid; place-items:center; color:rgba(255,255,255,.92);
 font-weight:900; letter-spacing:.10em; user-select:none; -webkit-user-select:none; touch-action:none;}
#focusBtn:active,#focusBtn.active{transform:scale(0.96); background:rgba(137,255,155,.16);} 

/* Right buttons: BOMB on top, FIRE below (LASER button removed) */
.actions{right:calc(0px + env(safe-area-inset-right)); bottom:calc(0px + env(safe-area-inset-bottom));
 display:flex; flex-direction:column; align-items:flex-end; gap:10px;}
.actions .row{display:flex; gap:10px; justify-content:flex-end;}

/* Keep legacy mobileUI hidden (avoid JS null refs in older wiring) */
#mobileUI{display:none !important;}

/* === Layout override: Right-top=BOMB, Right-middle=FIRE, Right-bottom=FOCUS+FIRE === */
.tbtn.bombTR{
  position:fixed;
  right:calc(0px + env(safe-area-inset-right));
  top:calc(0px + env(safe-area-inset-top));
  z-index:95;
}
.tbtn.fireMR{
  position:fixed;
  right:calc(0px + env(safe-area-inset-right));
  top:50%;
  transform:translateY(-50%);
  z-index:95;
}
#focusBtn.focusRB{
  position:fixed;
  left:auto;
  top:auto;
  right:calc(0px + env(safe-area-inset-right));
  bottom:calc(0px + env(safe-area-inset-bottom));
  width:128px;
  height:72px;
  border-radius:22px;
  z-index:95;
}
@media (min-width:430px){
  #focusBtn.focusRB{ width:168px; height:88px; font-size:15px; }
  .tbtn.bombTR{ width:200px; height:92px; font-size:16px; }
  .tbtn.fireMR{ width:92px; height:92px; border-radius:26px; font-size:14px; }
}

/* === HARD LOCK: Joystick stays bottom-left (no floating / no centering) === */
#joystick{
 position:fixed !important;
 left:calc(12px + env(safe-area-inset-left)) !important;
 bottom:calc(12px + env(safe-area-inset-bottom)) !important;
 right:auto !important;
 top:auto !important;
 width:136px !important;
 height:136px !important;
 transform:none !important;
 -webkit-user-drag:none;
 user-select:none;
 touch-action:none;
}

/* === TRANSLUCENT UI: make controls nearly transparent but still readable === */
:root{ --uiGlass: rgba(10,19,40,.18); --uiBorder: rgba(114,247,255,.16); }
#joystick{
 background: rgba(114,247,255,.04) !important;
 border: 1px solid rgba(114,247,255,.14) !important;
 backdrop-filter: blur(8px) saturate(1.15);
 box-shadow: 0 10px 24px rgba(0,0,0,.22) !important;
}
#joystick .base{
 background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.06), transparent 58%) !important;
 box-shadow: inset 0 0 0 1px rgba(255,255,255,.04) !important;
}
#joystick .stick{
 background: rgba(114,247,255,.62) !important;
 box-shadow: 0 8px 16px rgba(0,0,0,.26), 0 0 16px rgba(114,247,255,.16) !important;
}
#joystick .label{ color: rgba(222,242,255,.55) !important; }

.tbtn{
 background: rgba(10,19,40,.18) !important;
 border-color: rgba(114,247,255,.16) !important;
 box-shadow: 0 8px 20px rgba(0,0,0,.24) !important;
}
.tbtn.warn{ border-color: rgba(255,93,177,.18) !important; }
.tbtn.gold{ border-color: rgba(255,216,77,.18) !important; }
.tbtn.green{ border-color: rgba(137,255,155,.18) !important; }
.tbtn:active, .tbtn.active{ background: rgba(114,247,255,.14) !important; }
/* === Joystick: push further outside bottom-left + transparent while touching === */
:root{
  --joyIdleOpacity: .32;   /* 触っていない時 */
  --joyTouchOpacity: .08; /* 触っている間（透明化） */
  --joyFade: 120ms;
  --btnIdleOpacity: .28;  /* 右側ボタン: 触っていない時 */
  --btnTouchOpacity: .10; /* 右側ボタン: 触っている間（透明化） */
  --btnFade: 120ms;
}

/* 画面外寄りに（数値を大きくするとさらに外へ） */
#joystick{
  left: calc(-14px + env(safe-area-inset-left)) !important;
  bottom: calc(-14px + env(safe-area-inset-bottom)) !important;
  opacity: var(--joyIdleOpacity);
  transition: opacity var(--joyFade) ease;
}

/* 触っている間はさらに透明 */
#joystick.ui-touch{
  opacity: var(--joyTouchOpacity) !important;
}
#joystick .base{ opacity: .55; }
#joystick .stick{ opacity: .55; }
#joystick .label{ opacity: .55; }

/* === Right-side buttons: translucent + extra transparent while pressing === */
.tbtn, #focusBtn{
  opacity: var(--btnIdleOpacity) !important;
  transition: opacity var(--btnFade) ease, transform var(--btnFade) ease;
}
.tbtn.ui-touch, #focusBtn.ui-touch{
  opacity: var(--btnTouchOpacity) !important;
}




/* === ENTRY TABS (added, game body removed) === */
.entrybar{margin-top:10px; display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap;}
.entrytab{
  padding:10px 18px;
  border-radius:999px;
  border:1px solid rgba(114,247,255,.22);
  background:rgba(10,19,40,.54);
  color:rgba(255,255,255,.92);
  font-weight:900;
  letter-spacing:.14em;
  user-select:none;
  -webkit-user-select:none;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:0 10px 26px rgba(0,0,0,.35);
}
.entrytab:active{transform:scale(0.97); background:rgba(114,247,255,.18);} 

</style>
</head>
<body>
  <div class="frame">
    <div class="diag" id="diag"></div>
    <div class="rotate-hint" id="rotateHint" aria-live="polite">
      <div class="card">
        <div class="ttl">横画面で遊べます</div>
        <div class="msg">iPhoneを横向きに回転してください。<br>縦向きの間は誤操作防止のため一時停止します。</div>
        <div class="mini">（Safariはページ側から向きを強制できない場合があります）</div>
      </div>
    </div>

    <!-- Title canvas (title screen is rendered here). Game body removed. -->
    <canvas id="game" width="640" height="360" tabindex="0"></canvas>

    <div class="caption">
      <span class="pill">MOVE ←↑↓→ / SHOT Z / LASER X / BOMB C / FOCUS Shift / PAUSE Space / START Z / BGM: TF-STYLE FM / ENEMIES+3 FIX3 / FM MOD2</span>
    </div>

    <!-- Entry tabs -->
    <div class="entrybar" aria-label="入口">
      <button class="entrytab" type="button" data-entry="1">1へ</button>
      <button class="entrytab" type="button" data-entry="2">2へ</button>
    </div>
  </div>

<script>
"use strict";
// --- Minimal title-screen renderer (based on original drawing helpers). Game logic removed. ---
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', { alpha:false, desynchronized:true });
ctx.imageSmoothingEnabled = false;
const W = cvs.width, H = cvs.height;

const IS_MOBILE = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
let time = 0;
let stage = 1; // palette
let lowQuality = false;
const input = { focus:0 };

const rand = (a,b)=>Math.random()*(b-a)+a;
function drawStars(arr,color,blur=0){
  ctx.save();
  ctx.fillStyle = color;
  ctx.shadowBlur = blur;
  ctx.shadowColor = color;
  for(const s of arr) ctx.fillRect(s.x,s.y,s.s,s.s);
  ctx.restore();
}
function scrollStars(arr){
  const rate = input.focus ? .7 : 1;
  for(const s of arr){
    s.x -= s.v * rate;
    if(s.x < -6){ s.x = W + 6; s.y = Math.random()*H; }
  }
}
function glowText(text,x,y,size,align,color){
  ctx.save();
  ctx.font = '700 ' + size + 'px sans-serif';
  ctx.textAlign = align;
  ctx.fillStyle = color;
  ctx.shadowBlur = 18;
  ctx.shadowColor = color;
  ctx.fillText(text,x,y);
  ctx.restore();
}

const starsFar  = Array.from({length:(IS_MOBILE?42:90)}, ()=>({x:Math.random()*W,y:Math.random()*H,s:rand(.4,1.5),v:rand(.15,.5)}));
const starsMid  = Array.from({length:(IS_MOBILE?26:52)}, ()=>({x:Math.random()*W,y:Math.random()*H,s:rand(1.0,2.2),v:rand(.8,2.3)}));
const starsNear = Array.from({length:(IS_MOBILE?16:30)}, ()=>({x:Math.random()*W,y:Math.random()*H,s:rand(1.5,3.0),v:rand(2.3,4.4)}));

function drawBackground(t){
  if(lowQuality){
    ctx.fillStyle = '#020611';
    ctx.fillRect(0,0,W,H);
    drawStars(starsFar,'rgba(180,220,255,.18)',0);
    drawStars(starsMid,'rgba(114,247,255,.20)',0);
    drawStars(starsNear,'rgba(255,93,177,.18)',0);
    return;
  }
  const stagePal = {
    1:{top:'#08111f',mid:'#12385e',bot:'#050811',a:'rgba(114,247,255,.22)',b:'rgba(255,93,177,.12)',c:'rgba(137,255,155,.10)', wave:'#72f7ff', grid:'rgba(114,247,255,.07)'},
    2:{top:'#14061d',mid:'#43145e',bot:'#09020f',a:'rgba(255,93,177,.22)',b:'rgba(114,247,255,.10)',c:'rgba(255,179,71,.09)', wave:'#ff5db1', grid:'rgba(255,93,177,.06)'},
    3:{top:'#07141a',mid:'#164a56',bot:'#041013',a:'rgba(137,255,155,.22)',b:'rgba(114,247,255,.12)',c:'rgba(255,216,77,.08)', wave:'#89ff9b', grid:'rgba(137,255,155,.06)'},
    4:{top:'#120710',mid:'#4d1130',bot:'#0a0408',a:'rgba(255,98,98,.18)',b:'rgba(255,93,177,.10)',c:'rgba(255,179,71,.10)', wave:'#ff6262', grid:'rgba(255,98,98,.06)'},
    5:{top:'#151012',mid:'#5c360f',bot:'#0a0604',a:'rgba(255,216,77,.18)',b:'rgba(255,179,71,.12)',c:'rgba(255,93,177,.08)', wave:'#ffd84d', grid:'rgba(255,216,77,.06)'},
    6:{top:'#090717',mid:'#24144e',bot:'#04030b',a:'rgba(159,140,255,.22)',b:'rgba(114,247,255,.10)',c:'rgba(255,138,242,.10)', wave:'#9f8cff', grid:'rgba(159,140,255,.07)'},
    7:{top:'#050814',mid:'#1a2d63',bot:'#03040d',a:'rgba(114,247,255,.22)',b:'rgba(255,120,245,.14)',c:'rgba(255,216,77,.10)', wave:'#7cf8ff', grid:'rgba(124,248,255,.08)'}
  };
  const pal = stagePal[stage] || stagePal[1];
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,pal.top);
  g.addColorStop(.52,pal.mid);
  g.addColorStop(1,pal.bot);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  const orbs = [
    {x:W*(.18 + Math.sin(t*.006)*.03), y:H*(.22 + Math.cos(t*.004)*.03), r:190, c:pal.a},
    {x:W*(.72 + Math.cos(t*.005)*.04), y:H*(.30 + Math.sin(t*.003)*.05), r:160, c:pal.b},
    {x:W*(.58 + Math.sin(t*.004)*.05), y:H*(.78 + Math.cos(t*.006)*.03), r:210, c:pal.c},
  ];
  for(const o of orbs){
    const rg = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
    rg.addColorStop(0,o.c);
    rg.addColorStop(1,'transparent');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = pal.grid;
  for(let x=0;x<W;x+=48){
    ctx.beginPath();
    ctx.moveTo(x+((t*.3)%48),0);
    ctx.lineTo(x+((t*.3)%48),H);
    ctx.stroke();
  }
  for(let y=0;y<H;y+=48){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }
  ctx.restore();

  drawStars(starsFar,'rgba(180,220,255,.22)',0);
  drawStars(starsMid, pal.a.replace('.22','.35'), 8);
  drawStars(starsNear, pal.b.replace('.12','.26'), 12);

  ctx.save();
  ctx.globalAlpha=.16;
  ctx.strokeStyle = pal.wave;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for(let x=0;x<=W;x+=8){
    const y = H*.77 + Math.sin((x+t*3)*0.016)*8 + Math.sin((x+t*1.7)*0.03)*4;
    if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawTitle(){
  glowText('NEON STRIKER', W/2, 180, 68, 'center', '#72f7ff');
  glowText('NEON RAINBOW BOSS BULLETS', W/2, 250, 42, 'center', '#ff5db1');
  ctx.save();
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.84)';
  ctx.font='600 22px sans-serif';
  ctx.fillText('PRESS Z TO START', W/2, 412);
  ctx.restore();
}

function render(){
  drawBackground(time);
  drawTitle();
}

function loop(){
  time++;
  scrollStars(starsFar);
  scrollStars(starsMid);
  scrollStars(starsNear);
  render();
  requestAnimationFrame(loop);
}
loop();

(function(){
  const rh = document.getElementById('rotateHint');
  const isLand = ()=> (window.matchMedia && window.matchMedia('(orientation: landscape)').matches) || (innerWidth > innerHeight);
  const upd = ()=>{ if(!rh) return; rh.style.display = isLand() ? 'none' : 'grid'; };
  addEventListener('resize', upd);
  addEventListener('orientationchange', upd);
  upd();
})();

// Entry tabs -> default navigation to 1.html / 2.html
for(const btn of document.querySelectorAll('[data-entry]')){
  btn.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    const n = btn.getAttribute('data-entry');
    location.href = (n === '1') ? 'neon1.html' : 'neon2.html';
  }, {passive:false});
}
</script>
</body>
</html>
